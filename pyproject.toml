[tool.poetry]
name = "napstertec-ai-gateway"
version = "2.0.0"
description = "Enterprise OpenAI-compatible Multi-Provider AI Gateway for NapsterTec AI."
authors = ["Napster <contact@napstertec.com>"]
readme = "README.md"
keywords = ["ai", "gateway", "llm", "proxy", "openai-compatible", "failover"]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
pydantic-settings = "^2.0.0"
pydantic = "^2.0.0"
vercel = "0.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
