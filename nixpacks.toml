# Nixpacks configuration for Railway deployment with Playwright Chromium support
[phases.setup]
nixPkgs = [
    "glib",
    "nss",
    "nspr",
    "atk",
    "at-spi2-atk",
    "cups",
    "dbus",
    "libdrm",
    "libxkbcommon",
    "pango",
    "mesa",
    "alsa-lib",
    "cairo"
]
aptPkgs = [
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2",
    "libpango-1.0-0",
    "libcairo2"
]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "pip install -r requirements.txt",
    "playwright install --with-deps chromium"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"
RAILPACK_PYTHON_PLAYWRIGHT_INSTALL = "1"
